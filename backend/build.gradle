plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.calendar'
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation 'at.favre.lib:bcrypt:0.10.2'
	implementation 'com.auth0:java-jwt:4.4.0'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.11.4'
}

springBoot {
	mainClass = 'com.calendar.CalendarApplication'
}

tasks.withType(JavaExec).configureEach {
	jvmArgs '--enable-native-access=ALL-UNNAMED'
}

tasks.register('seed', JavaExec) {
	group = 'application'
	classpath = sourceSets.main.runtimeClasspath
	mainClass = 'com.calendar.seed.SeedRunner'
}

tasks.named('test') {
	useJUnitPlatform()
	jvmArgs '-Xshare:off'
	// bun run test merges these results into output/junit.xml.
	reports.junitXml.outputLocation = file('../.cache/junit/backend')
}
